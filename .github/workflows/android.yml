name: FROM ZERO | 3D Art + Touch Controls QA

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  android:
    name: Import licensed 3D art, test, export Android
    runs-on: ubuntu-24.04
    container:
      image: barichello/godot-ci:4.6.3
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Fetch pinned commercial-use CC0 3D models
        shell: bash
        run: |
          set -eu
          python3 tools/fetch_models.py
          test -s assets/models/city-kit-commercial/building-a.glb
          test -s assets/models/mini-characters/character-male-a.glb
          test -s assets/models/car-kit/taxi.glb

      - name: Import project and check GDScript
        shell: bash
        run: |
          set -eu
          godot --headless --editor --path . --import --quit
          for script in scripts/world.gd scripts/player.gd scripts/stick.gd scripts/hud.gd scripts/game.gd scripts/radar.gd scripts/economy.gd; do
            godot --headless --path . --check-only --script "res://$script"
          done

      - name: Run gameplay and full 360-degree touch control tests
        shell: bash
        run: |
          set -eu
          godot --headless --path . --script res://tests/economy_tests.gd
          FROMZERO_TEST_MOBILE=1 godot --headless --path . --script res://tests/mobile_controls_tests.gd
          timeout 125 godot --headless --path . --quit-after 70

      - name: Build Android debug APK with 3D assets
        shell: bash
        run: |
          set -eu
          mkdir -p build
          godot --headless --path . --export-debug Android build/From-Zero-3D-art-pass-debug.apk
          test -s build/From-Zero-3D-art-pass-debug.apk

      - name: Publish internal APK
        uses: actions/upload-artifact@v4
        with:
          name: From-Zero-3D-ArtPass-Android-debug
          path: build/From-Zero-3D-art-pass-debug.apk
          if-no-files-found: error
          retention-days: 14
