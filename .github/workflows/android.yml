name: FROM ZERO | Mobile Visual Rebuild v0.5

on:
  push:
    branches: [main]
  workflow_dispatch:

# Prevent one broken headless test from holding a runner indefinitely.
concurrency:
  group: from-zero-android-build
  cancel-in-progress: true

jobs:
  android:
    name: Import models, validate controls, export Android
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container:
      image: barichello/godot-ci:4.6.3
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Fetch licensed 3D models and animated NPC
        shell: bash
        run: |
          set -eu
          apt-get update -qq
          apt-get install -y --no-install-recommends python3 ca-certificates fontconfig
          python3 tools/fetch_models.py
          test -s assets/models/city-kit-commercial/building-a.glb
          test -s assets/models/mini-characters/character-male-a.glb
          test -s assets/models/car-kit/taxi.glb
          test -s assets/models/animated-npc/CesiumMan.glb

      - name: Restore Android export SDK and templates
        shell: bash
        run: |
          set -eu
          mkdir -p "$HOME/.config" "$HOME/.local/share/godot/export_templates"
          cp -a /root/.config/godot "$HOME/.config/"
          cp -a /root/.local/share/godot/export_templates/4.6.3.stable "$HOME/.local/share/godot/export_templates/"
          test -s "$HOME/.local/share/godot/export_templates/4.6.3.stable/android_debug.apk"
          test -f "$HOME/.config/godot/editor_settings-4.6.tres"

      - name: Import project and check GDScript
        shell: bash
        run: |
          set -eu
          godot --headless --editor --path . --import --quit
          for script in scripts/world.gd scripts/player.gd scripts/stick.gd scripts/hud.gd scripts/game.gd scripts/radar.gd scripts/economy.gd; do
            godot --headless --path . --check-only --script "res://$script"
          done

      - name: Run gameplay and full 360-degree touch control tests
        shell: bash
        run: |
          set -euo pipefail
          run_checked_test() {
            local script="$1"
            local required_line="$2"
            local log_file
            log_file="$(mktemp)"
            echo "::group::Godot test: $script"
            if ! timeout --signal=TERM --kill-after=5s 50s godot --headless --path . --script "$script" --quit-after 300 >"$log_file" 2>&1; then
              cat "$log_file"
              echo "::error::Godot test failed or timed out: $script"
              exit 1
            fi
            cat "$log_file"
            if ! grep -Fq "$required_line" "$log_file"; then
              echo "::error::Godot exited without reaching the PASS marker: $script"
              exit 1
            fi
            echo "::endgroup::"
          }
          run_checked_test res://tests/economy_tests.gd "CONTRACT ECONOMY TESTS: PASS"
          export FROMZERO_TEST_MOBILE=1
          run_checked_test res://tests/mobile_controls_tests.gd "MOBILE 3 RESOLUTIONS + 8-WAY TOUCH + MENU: PASS"
          timeout --signal=TERM --kill-after=5s 90s godot --headless --path . --quit-after 70

      - name: Build Android debug APK with 3D assets
        shell: bash
        run: |
          set -eu
          mkdir -p build
          godot --headless --path . --export-debug Android build/From-Zero-3D-v0.5-debug.apk
          test -s build/From-Zero-3D-v0.5-debug.apk

      - name: Publish internal APK
        uses: actions/upload-artifact@v4
        with:
          name: From-Zero-3D-v05-Android-debug
          path: build/From-Zero-3D-v0.5-debug.apk
          if-no-files-found: error
          retention-days: 14
