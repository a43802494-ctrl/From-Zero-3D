name: FROM ZERO | Android APK - internal build

on:
  push:
    branches: [main, master]
  workflow_dispatch:
  pull_request:
    branches: [main, master]

jobs:
  android:
    name: Build Android arm64 debug APK
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    container:
      image: barichello/godot-ci:4.6.3
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Import project and validate GDScript
        shell: bash
        run: |
          set -eu
          godot --headless --editor --path . --import --quit
          godot --headless --path . --check-only --script res://scripts/game.gd
          godot --headless --path . --check-only --script res://scripts/world.gd
          godot --headless --path . --check-only --script res://scripts/player.gd
          godot --headless --path . --check-only --script res://scripts/hud.gd
          godot --headless --path . --check-only --script res://scripts/stick.gd
          godot --headless --path . --check-only --script res://scripts/radar.gd
          godot --headless --path . --check-only --script res://scripts/economy.gd

      - name: Test contracts and startup scene
        shell: bash
        run: |
          set -eu
          echo 'START economy unit tests'
          timeout 30 godot --headless --path . --script res://tests/economy_tests.gd
          echo 'FINISHED economy unit tests'
          mkdir -p build
          echo 'START game startup smoke test'
          timeout 75 godot --headless --path . --quit-after 60
          echo 'FINISHED game startup smoke test'

      - name: Export debuggable Android APK
        shell: bash
        run: |
          set -eu
          mkdir -p build
          godot --headless --path . --export-debug "Android" build/FromZero-RiseCity-debug.apk
          test -s build/FromZero-RiseCity-debug.apk

      - name: Upload downloadable APK
        uses: actions/upload-artifact@v4
        with:
          name: FromZero-RiseCity-Android-APK-internal
          path: build/FromZero-RiseCity-debug.apk
          if-no-files-found: error
          retention-days: 14
